<!doctype html>
<html lang="en-US">
<head>

  <link rel="apple-touch-icon" href="/blackfriday/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="thank-you" class="page-simple">
<main>
  <section class="section section--dark hero" aria-labelledby="ty-title">
    <div class="wrap" style="display:grid;gap:20px;justify-items:start">
      <img class="simple-logo" src="/blackfriday/assets/img/logo-360.png" width="360" height="257" alt="My Team Renovation">
      <span class="tag tag--bf" data-bf-tag><span>BLACK FRIDAY</span></span>
      <h1 class="display" id="ty-title">You’re all set. <strong>Leonardo will call you soon.</strong></h1>
      <p class="lede" style="color:rgba(255,255,255,.88)">Your Black Friday 15% applies to contracts signed <span data-cfg="CONTRACT_DEADLINE_TEXT">XX – XX</span>. Keep your phone close — we’ll call from <a href="tel:+18328785912" data-tel style="color:#fff;font-weight:700"><span data-cfg="PHONE">(832) 878-5912</span></a>.</p>
      <div class="tape" data-tape style="width:100%;max-width:520px">
        <div class="tape__track" aria-hidden="true"><div class="tape__fill"></div></div>
        <span class="tape__label" data-ends>ENDS XX</span>
      </div>
    </div>
  </section>

  <section class="section section--light" aria-label="Shower styles">
    <div class="wrap">
      <div class="strip strip--3">
        <figure>
          <picture><source type="image/webp" srcset="/blackfriday/assets/img/style-walk-in-480.webp 480w, /blackfriday/assets/img/style-walk-in-768.webp 768w" sizes="(min-width: 768px) 30vw, 70vw">
          <img class="is-warm" src="/blackfriday/assets/img/style-walk-in-480.jpg" width="480" height="640" loading="lazy" decoding="async" alt="Walk-in shower with a built-in tiled bench"></picture>
          <figcaption>Walk-in with bench</figcaption>
        </figure>
        <figure>
          <picture><source type="image/webp" srcset="/blackfriday/assets/img/style-frameless-480.webp 480w, /blackfriday/assets/img/style-frameless-768.webp 768w" sizes="(min-width: 768px) 30vw, 70vw">
          <img class="is-warm" src="/blackfriday/assets/img/style-frameless-480.jpg" width="480" height="640" loading="lazy" decoding="async" alt="Shower with a frameless glass enclosure"></picture>
          <figcaption>Frameless glass</figcaption>
        </figure>
        <figure>
          <picture><source type="image/webp" srcset="/blackfriday/assets/img/style-curbless-480.webp 480w, /blackfriday/assets/img/style-curbless-768.webp 768w" sizes="(min-width: 768px) 30vw, 70vw">
          <img class="is-warm" src="/blackfriday/assets/img/style-curbless-480.jpg" width="480" height="600" loading="lazy" decoding="async" alt="Curbless walk-in shower with a linear drain"></picture>
          <figcaption>Curbless, linear drain</figcaption>
        </figure>
      </div>
      <p style="margin-top:28px"><a class="reviews__all" href="https://myteamrenovation.com" style="color:var(--mtr-gold-lo)">← Back to My Team Renovation</a><!-- ⚠ main site URL --></p>
    </div>
  </section>
