name: Deploy to Coolify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            echo "Disparando deploy no Coolify..."
            curl -f -sS -X POST "$WEBHOOK_URL"
          else
            echo "Secret COOLIFY_WEBHOOK_URL não configurada. Pule este step se estiver usando o Webhook nativo do GitHub."
          fi
