name: Deploy to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -n "$COOLIFY_TOKEN" ]; then
            echo "Disparando deploy no Coolify..."
            curl -f -sS -X POST "https://aguiardev.online/api/v1/deploy?uuid=kb2qepvj6twdkcysfl3ppbdl&force=false" \
              -H "Authorization: Bearer $COOLIFY_TOKEN"
            echo "Deploy disparado com sucesso!"
          else
            echo "Erro: Secret COOLIFY_API_TOKEN não encontrada no repositório."
            exit 1
          fi
